services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecosort-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/ecosort}
      - JWT_SECRET=${JWT_SECRET:-ecosort_jwt_secret_key_2026}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    env_file:
      - ./backend/.env
    networks:
      - ecosort-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: ecosort-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - ecosort-network

networks:
  ecosort-network:
    driver: bridge
